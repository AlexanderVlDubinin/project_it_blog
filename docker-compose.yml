services:
  # Nginx
  nginx:
    image: nginx:alpine
    container_name: laravel_pet_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_pet_network
    depends_on:
      - php

  # PHP-FPM 8.4
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel_pet_php
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    networks:
      - laravel_pet_network
    depends_on:
      - postgres
      - redis # Добавить, чтобы PHP ждал запуска Redis

  # PostgreSQL (База данных)
  postgres:
    image: postgres:16-alpine
    container_name: laravel_pet_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel_pet_blog}
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - laravel_pet_network

  # Mailpit (Тестирование почты)
  mailpit:
    image: axllent/mailpit
    container_name: laravel_pet_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Веб-интерфейс
      - "1025:1025" # SMTP порт
    networks:
      - laravel_pet_network
  
  # Redis (кэш, очереди)
  redis:
    image: redis:7-alpine
    container_name: laravel_pet_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - laravel_pet_network

networks:
  laravel_pet_network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata: # Добавлено для сохранения данных Redis при перезапуске
    driver: local